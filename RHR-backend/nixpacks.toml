# whatsapp-web.js needs a working Chromium.
#
# Attempt 1 (Puppeteer's own bundled Chrome download) failed on Railway with
# missing shared libraries (libglib-2.0.so.0, ...).
# Attempt 2 (apt-get install chromium) failed too: on Ubuntu-based images
# (which Railway's nixpacks images are), the "chromium" apt package is a
# transitional stub that redirects to snap — there is no real binary at
# /usr/bin/chromium in a container (no snapd available).
#
# Fix: install chromium via Nix instead (a genuine self-contained binary,
# no snap involved), and resolve its actual path at container start time
# rather than hardcoding a path that may not match the Nix store hash.
[phases.setup]
nixPkgs = ["chromium"]

[start]
cmd = "PUPPETEER_EXECUTABLE_PATH=$(command -v chromium) node server.js"
