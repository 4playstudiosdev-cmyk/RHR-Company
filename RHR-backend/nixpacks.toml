# Ensures Puppeteer/Chromium (used by whatsapp-web.js) has the shared
# libraries it needs to actually launch on Railway's default Node image.
# Without these, the bot process can crash/hang silently on boot with no
# clear error — works locally (Windows/full Chrome) but not on Railway.
[phases.setup]
aptPkgs = [
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libpangocairo-1.0-0",
  "libpango-1.0-0",
  "libcairo2",
  "libx11-xcb1",
  "libxshmfence1"
]
